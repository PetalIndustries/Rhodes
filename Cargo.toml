[package]
name = "rhodes"
repository = "https://github.com/PetalIndustries/Rhodes"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
env_logger = "0.11.8"
gl = { version = "0.14.0", optional = true }
glfw = { version = "0.60.0", optional = true }
log = "0.4.28"
mlua = { version = "0.11.4", features = ["luau-jit"] }
num-traits = "0.2.19"

[features]
default = ["glfw"]
glfw = ["dep:gl", "dep:glfw"]
webgl = []